<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Base Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            text-decoration: none;
            list-style: none;
        }

        body {
            background-color: #f4f4f9;
        }

        /* Navbar Styling */
        .navbar {
            background-color: #ffffff;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            position: sticky;
            top: 0;
            z-index: 1000;
            width: 100%;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 70px;
        }

        .nav-logo {
            font-size: 1.5rem;
            font-weight: 600;
            color: #2575fc;
        }

        .nav-menu {
            display: flex;
            align-items: center;
            gap: 30px;
        }

        .nav-link {
            color: #333;
            font-size: 1rem;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .nav-link:hover {
            color: #2575fc;
        }

        .nav-btn {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            color: #fff !important;
            padding: 10px 20px;
            border-radius: 25px;
            transition: opacity 0.3s ease, transform 0.2s ease;
        }

        .nav-btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        .hamburger {
            display: none;
            cursor: pointer;
            font-size: 1.5rem;
            color: #333;
        }

        /* Form Wrapper Styling */
        .form-wrapper {
            max-width: 500px;
            margin: 40px auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .form-wrapper h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #2575fc;
            font-weight: 600;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #333;
        }

        .input-group input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s ease;
        }

        .input-group input:focus {
            border-color: #2575fc;
        }

        .error-message {
            color: #ff4d4d;
            font-size: 0.85rem;
            margin-top: 5px;
            display: block;
        }

        .submit-btn {
            width: 100%;
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            color: #fff;
            padding: 12px;
            border: none;
            border-radius: 25px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: opacity 0.3s ease, transform 0.2s ease;
        }

        .submit-btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #6a11cb;
            font-size: 0.9rem;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        @media screen and (max-width: 768px) {
            .hamburger { display: block; }
            .nav-menu {
                position: absolute;
                top: 70px;
                left: -100%;
                flex-direction: column;
                background-color: #ffffff;
                width: 100%;
                text-align: center;
                padding: 30px 0;
                box-shadow: 0 10px 10px rgba(0, 0, 0, 0.05);
                transition: 0.3s ease-in-out;
                gap: 20px;
            }
            .nav-menu.active { left: 0; }
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">BrandLogo</a>
            <ul class="nav-menu">
                <li class="nav-item"><a href="aboutus.html" class="nav-link">About Us</a></li>
                <li class="nav-item"><a href="services.html" class="nav-link">Services</a></li>
                <li class="nav-item"><a href="form1.html" class="nav-link nav-btn">Registration Form</a></li>
            </ul>
            <div class="hamburger"><i class="fa-solid fa-bars"></i></div>
        </div>
    </nav>

    <!-- Registration Form Container -->
    <div class="form-wrapper">
        <h2>Registration Form</h2>
        <form id="registrationForm" novalidate>
            <div class="input-group">
                <label for="username">Full Name</label>
                <input type="text" id="username" placeholder="Enter your full name">
                <span class="error-message" id="nameError"></span>
            </div>

            <div class="input-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="Enter your email">
                <span class="error-message" id="emailError"></span>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter at least 6 characters">
                <span class="error-message" id="passwordError"></span>
            </div>

            <div class="input-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" placeholder="Re-enter your password">
                <span class="error-message" id="confirmPasswordError"></span>
            </div>

            <button type="submit" class="submit-btn">Register</button>
            <a href="index.html" class="back-link">← Back to Home</a>
        </form>
    </div>

    <script src="script.js"></script>
    <script>
        const form = document.getElementById('registrationForm');
        const username = document.getElementById('username');
        const email = document.getElementById('email');
        const password = document.getElementById('password');
        const confirmPassword = document.getElementById('confirmPassword');

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            let isValid = true;

            if (username.value.trim() === '') {
                document.getElementById('nameError').innerText = 'Full name is required.';
                isValid = false;
            } else {
                document.getElementById('nameError').innerText = '';
            }

            const emailPattern = /^[^ ]+@[^ ]+\.[a-z]{2,3}$/;
            if (email.value.trim() === '') {
                document.getElementById('emailError').innerText = 'Email is required.';
                isValid = false;
            } else if (!email.value.match(emailPattern)) {
                document.getElementById('emailError').innerText = 'Please enter a valid email address.';
                isValid = false;
            } else {
                document.getElementById('emailError').innerText = '';
            }

            if (password.value.trim() === '') {
                document.getElementById('passwordError').innerText = 'Password is required.';
                isValid = false;
            } else if (password.value.length < 6) {
                document.getElementById('passwordError').innerText = 'Password must be at least 6 characters.';
                isValid = false;
            } else {
                document.getElementById('passwordError').innerText = '';
            }

            if (confirmPassword.value.trim() === '') {
                document.getElementById('confirmPasswordError').innerText = 'Please confirm your password.';
                isValid = false;
            } else if (confirmPassword.value !== password.value) {
                document.getElementById('confirmPasswordError').innerText = 'Passwords do not match.';
                isValid = false;
            } else {
                document.getElementById('confirmPasswordError').innerText = '';
            }

            if (isValid) {
                alert('Registration successful!');
                form.reset();
            }
        });
    </script>
</body>
</html>
